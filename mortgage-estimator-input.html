        <script>
    (function(){
      const buttons = document.querySelectorAll(".intent-btn");
      const debtWrap = document.getElementById("debt-wrap");
      const cashWrap = document.getElementById("cash-wrap");
      function render(mode){
        if(mode === "ready"){
          debtWrap.innerHTML =
            `<input class="sass-number" type="number" placeholder="Exact monthly obligations ($)">`;
          cashWrap.innerHTML =
            `<input class="sass-number" type="number" placeholder="Cash available now ($)">`;
        }
        else if(mode === "soon"){
          debtWrap.innerHTML =
            `<select class="sass-select">
              <option>Under $750</option>
              <option>$750 – $1,500</option>
              <option>$1,500 – $2,500</option>
              <option>$2,500+</option>
            </select>`;
          cashWrap.innerHTML =
            `<select class="sass-select">
              <option>VA / minimal cash</option>
              <option>Some reserves</option>
              <option>Building savings</option>
            </select>`;
        }
        else {
          debtWrap.innerHTML =
            `<select class="sass-select">
              <option>Very manageable</option>
              <option>Comfortable</option>
              <option>Tight but controlled</option>
              <option>Feels heavy right now</option>
            </select>`;
          cashWrap.innerHTML =
            `<select class="sass-select">
              <option>Not focused yet</option>
              <option>Early savings</option>
              <option>Not ready</option>
            </select>`;
        }
      }
      buttons.forEach(btn => {
        btn.onclick = () => {
          buttons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          render(btn.dataset.mode);
        };
      });
      render("ready");
    })();
