        <script>
    (()=>{
      const $=(q)=>document.querySelector(q);
      const cur=(n)=> (Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0});
      function pmti(P,r,n){
        if(r===0) return P/n;
        const x=Math.pow(1+r,n);
        return P*(r*x)/(x-1);
      }
      const CLOSE_PCT = 0.03;
      const SELL_PCT  = 0.07;
      const APP_Y     = 0.03;
      const INVRET_Y  = 0.05;
      const MAINT_Y   = 0.01;
      function buildSeries(s, rentStartMonthly){
        const Y = 10;
        const N = Y*12;
        const labels = Array.from({length:Y+1}, (_,i)=> `Year ${i}`);
        const price = Math.max(150000, Number(s.price)||350000);
        const down  = Number(s.dpAmt)||0;
        const loan0 = Math.max(0, price - down);
        const r_m   = (Number(s.apr)||7)/100/12;
        const termN = (Number(s.termYears)||30)*12;
        const piMo = loan0>0 ? pmti(loan0, r_m, termN) : 0;
        const tihoa = Number(s.tihoa)||0;
        const pmi   = Number(s.pmi)||0;
        const maintMo = (price*MAINT_Y)/12;
        const closing = price*CLOSE_PCT;
        const upfront = down + closing;
        const rent0 = rentStartMonthly;
        const rent_g_m = Math.pow(1+0.03, 1/12)-1;
        const appr_m = Math.pow(1+APP_Y, 1/12)-1;
        const inv_m  = Math.pow(1+INVRET_Y, 1/12)-1;
        let bal = loan0, homeVal=price;
        let cumRent=0, cumOwner=upfront;
        const rentSeries=[0], buySeries=[upfront];
        const equityByYear=[down], cumRentByYear=[0];
        let altInvest = down;
        let beMonth=null;
        for(let m=1; m<=N; m++){
          const rent_m = rent0 * Math.pow(1+rent_g_m, m-1);
          cumRent += rent_m;
          altInvest *= (1+inv_m);
          const interest = bal * r_m;
          const principal = Math.max(0, piMo - interest);
          bal = Math.max(0, bal - principal);
          cumOwner += (piMo + tihoa + pmi + maintMo);
          homeVal *= (1+appr_m);
          const equity = Math.max(0, homeVal - bal);
          const netIfSold = Math.max(homeVal - (homeVal*SELL_PCT) - bal, 0);
          const buyNet_m  = Math.max(0, cumOwner - netIfSold);
          const rentNet_m = Math.max(0, cumRent - (altInvest - down));
          if (beMonth===null && buyNet_m <= rentNet_m){
            beMonth = m;
          }
          if(m%12===0){
            buySeries.push(buyNet_m);
            rentSeries.push(rentNet_m);
            equityByYear.push(equity);
            cumRentByYear.push(cumRent);
          }
        }
        const beYears = beMonth!==null ? (beMonth/12) : null;
        return {labels, rentSeries, buySeries, equityByYear, cumRentByYear, beYears};
      }
      let lineChart=null;
      function initChart(){
        const ctx=document.getElementById('rvb-line').getContext('2d');
        lineChart = new Chart(ctx,{
          type:'line',
          data:{ labels:[], datasets:[
            {label:'Buy – Net Cost', data:[], tension:.35, fill:false, borderWidth:2, pointRadius:0, borderColor:'#6aa7ff'},
            {label:'Rent – Net Cost', data:[], tension:.35, fill:false, borderWidth:2, pointRadius:0, borderColor:'#55d399'}
          ]},
          options:{
            plugins:{
              legend:{display:true, labels:{color:'#fff'}},
              tooltip:{
                callbacks:{
                  label:(c)=>{
                    const lbl = `${c.dataset.label}: ${cur(c.raw)}`;
                    return lbl;
                  }
                }
              }
            },
            scales:{
              x:{ticks:{color:'#fff'}, grid:{display:false}},
              y:{ticks:{color:'#fff'}, grid:{color:'rgba(255,255,255,.06)'}}
            },
            responsive:true,
            maintainAspectRatio:false
          }
        });
      }
      const defaultData = {
        price:350000,
        dpAmt:20000,
        apr:7.0,
        tihoa:250,
        pmi:0,
        termYears:30
      };
      function paint(){
        const s = defaultData;
        const rentStart = Number($('#rent-select').value)||2500;
        const rvb = buildSeries(s, rentStart);
        lineChart.data.labels = rvb.labels;
        lineChart.data.datasets[0].data = rvb.buySeries;
        lineChart.data.datasets[1].data = rvb.rentSeries;
        lineChart.update();
        $('#be-yrs').textContent =
          rvb.beYears==null
            ? '—'
            : (Math.round(rvb.beYears*10)/10).toFixed(1).replace('.0','');
      }
      function populateRentSelect(){
        const base = 3500;
        const vals=[];
        for(let d=-6; d<=6; d++){
          vals.push(base + d*200);
        }
        $('#rent-select').innerHTML = vals.map(v=> `<option value="${v}">${cur(v)}</option>`).join('');
        $('#rent-select').value = base;
      }
      (function boot(){
        populateRentSelect();
        initChart();
        paint();
      })();
      document.addEventListener('change',(e)=>{
        if(e.target.id==='rent-select') paint();
      });
    })();
  </script>
