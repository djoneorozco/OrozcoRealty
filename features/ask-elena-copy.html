              <script>
(function(){
  "use strict";
  const API_BASE = "https://theorozcorealty.netlify.app/api";
  // Which pages should be locked
  const ALLOW_PATHS = [
    /\/realtysass(?:\.html)?$/i,
  ];
  const path = (location.pathname || "/").toLowerCase();
  const shouldLock = ALLOW_PATHS.some(re => re.test(path));
  if (!shouldLock){
    document.querySelectorAll('#rs-lock-overlay').forEach(el => el.remove());
    return;
  }
  const overlay  = document.getElementById('rs-lock-overlay');
  const msg      = document.getElementById('rs-lock-msg');
  const emailInp = document.getElementById('rs-email-input');
  const passInp  = document.getElementById('rs-pass-input');
  const loginBtn = document.getElementById('rs-login-btn');
  const card     = document.getElementById('rs-lock-card');
  // Show overlay
  overlay.classList.remove('rs-hidden');
  overlay.style.visibility = 'visible';
  overlay.style.opacity = '1';
  // ARIA fix
  overlay.removeAttribute("aria-hidden");
  function showMsg(text, isError){
    msg.textContent = text || '';
    msg.style.color = isError ? '#ffb3b3' : 'var(--rs-muted)';
  }
  function unlock(){
    document.querySelectorAll('#rs-lock-overlay').forEach(el=>{
      el.classList.add('rs-hidden');
      el.style.visibility = 'hidden';
      el.style.opacity = '0';
      el.setAttribute("aria-hidden","true");
    });
  }
  async function loginWithServer(email, password){
    const res = await fetch(`${API_BASE}/login`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false){
      throw new Error(data.error || "Incorrect email or password.");
    }
    return data;
  }
  // NEW: remember who just logged in (for dashboards)
  function rememberLogin(email, serverData){
    try{
      // core key the dashboards can read
      localStorage.setItem("realtysass.loginEmail", email);
      // optional identity blob
      const existing = JSON.parse(localStorage.getItem("realtysass.identity") || "{}") || {};
      existing.email = email;
      // if the API happens to send a profile, lightly merge it
      const profile = (serverData && (serverData.profile || serverData.user || {})) || {};
      if (profile.full_name && !existing.name){
        existing.name = profile.full_name;
      }
      if (profile.phone && !existing.phone){
        existing.phone = profile.phone;
      }
      if (profile.rank && !existing.rankPaygrade){
        existing.rankPaygrade = profile.rank;
      }
      if (profile.va_disability && !existing.vaDisability){
        existing.vaDisability = profile.va_disability;
      }
      if (profile.years_of_service && !existing.yearsOfService){
        existing.yearsOfService = profile.years_of_service;
      }
      if (profile.mode && !existing.mode){
        existing.mode = profile.mode;
      }
      localStorage.setItem("realtysass.identity", JSON.stringify(existing));
    }catch(e){
      // fail silently; login still works
    }
  }
  async function onLogin(){
    const em = emailInp.value.trim().toLowerCase();
    const pw = passInp.value.trim();
    if (!em){
      showMsg("Please enter your email.", true);
      return;
    }
    if (pw.length < 8){
      showMsg("Password must be at least 8 characters.", true);
      return;
    }
    loginBtn.disabled = true;
    showMsg("Checking credentials...");
    try {
      const data = await loginWithServer(em, pw);
      // NEW: store email/profile locally for the Financial Dashboard
      rememberLogin(em, data);
      showMsg("");
      unlock();
    } catch (err){
      showMsg(err.message || "Incorrect email or password.", true);
      if(card && card.animate){
        card.animate(
          [
            { transform:'translateX(-5px)' },
            { transform:'translateX(5px)' },
            { transform:'translateX(0)' }
          ],
          { duration:260 }
        );
      }
    } finally {
      loginBtn.disabled = false;
    }
  }
  loginBtn.addEventListener("click", onLogin);
  passInp.addEventListener("keydown", e=>{
    if (e.key === "Enter") onLogin();
  });
  setTimeout(()=> emailInp.focus(), 0);
})();
</script>

              <input id="ae-input" class="ae-input" type="text" placeholder="Ask Elena anything…">
              <button id="ae-send" class="ae-btn">Send</button>
            </div>
          </div>
        </div>
        <!--  ============================================================
     //#6 JAVASCRIPT — CHAT ENGINE + TYPEWRITER
===============================================================  -->
        <script>
(() => {
  const root = document.getElementById("ask-elena-shell");
  const ENDPOINT = root.getAttribute("data-endpoint");
  const chatEl = document.getElementById("ae-chat");
  const inputEl = document.getElementById("ae-input");
  const sendBtn = document.getElementById("ae-send");
  const prefersReduced = () =>
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  async function pushMsg(role, content, opts = {}) {
    const { typewriter = false, speed = 22, delay = 150 } = opts;
    const msg = document.createElement("div");
    msg.className = "ae-msg " + (role === "user" ? "ae-user" : "ae-bot");
    const textNode = document.createElement("span");
    msg.appendChild(textNode);
    chatEl.appendChild(msg);
    scrollToBottom();
    if (!typewriter || prefersReduced() || role === "user") {
      textNode.textContent = content;
      scrollToBottom();
      return;
    }
    await typewriterInto(textNode, content, speed, delay);
    scrollToBottom();
  }
  function showTyping() {
    const t = document.createElement("div");
    t.className = "ae-msg ae-bot ae-typing";
    t.id = "ae-typing";
    t.textContent = "Elena is thinking…";
    chatEl.appendChild(t);
    scrollToBottom();
  }
  function hideTyping() {
    const t = document.getElementById("ae-typing");
    if (t) t.remove();
  }
  function typewriterInto(el, text, speed = 22, startDelay = 150) {
    return new Promise((resolve) => {
      el.textContent = "";
      const caret = document.createElement("span");
      caret.className = "tw-caret";
      el.appendChild(caret);
      let i = 0;
      const tick = () => {
        if (i < text.length) {
          caret.insertAdjacentText("beforebegin", text.charAt(i++));
          scrollToBottom();
          setTimeout(tick, speed);
        } else {
          caret.remove();
          resolve();
        }
      };
      setTimeout(tick, startDelay);
    });
  }
  async function callElena(userText) {
    sendBtn.disabled = true;
    showTyping();
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: userText,
          context: {
            source: "webflow",
            widget: "ask-elena",
            version: "command-center-2.1"
          }
        })
      });
      const data = await res.json();
      hideTyping();
      if (!res.ok) throw new Error(data?.error || "Request failed.");
      const reply = data.reply || "I’m here. What would you like to explore?";
      const ui = data.ui || {};
      const speed = Number(ui.speed || 22);
      const delay = Number(ui.startDelay || 150);
      await pushMsg("assistant", reply, { typewriter: true, speed, delay });
    } catch (err) {
      hideTyping();
      await pushMsg("assistant", "Hmm… I hit a connection snag. Mind asking again?", { typewriter: true });
    } finally {
      sendBtn.disabled = false;
    }
  }
  function trySend() {
    const text = inputEl.value.trim();
    if (!text) return;
    pushMsg("user", text);
    inputEl.value = "";
    callElena(text);
  }
  sendBtn.addEventListener("click", trySend);
  inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") trySend(); });
  // Warm greeting
  const greeting = "Hey — I’m Elena, your Virtual Concierge. Tell me your goal, and I’ll carve the path. Want to begin with budget, VA options, or neighborhoods?";
  pushMsg("assistant", greeting, { typewriter: true, speed: 22, delay: 300 });
})();
</script>
      </div>
    </div>
